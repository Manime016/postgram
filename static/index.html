<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <title>Postgram — Share your world</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-view="feed">
        <span class="brand-mark">P</span>
        <span>postgram</span>
      </a>
      <div class="top-actions">
        <button class="icon-btn" id="refreshBtn" title="Refresh feed" aria-label="Refresh feed">↻</button>
        <button class="avatar" id="profileBtn" title="Account">M</button>
      </div>
    </header>

    <main class="main">
      <section id="authView" class="auth-view">
        <div class="auth-copy">
          <span class="eyebrow">YOUR MOMENTS. YOUR SPACE.</span>
          <h1>Share what<br><em>matters.</em></h1>
          <p>A clean, private-first place for photos and videos. Post something worth remembering.</p>
        </div>
        <div class="auth-card">
          <div class="auth-tabs">
            <button class="tab active" data-auth="login">Sign in</button>
            <button class="tab" data-auth="register">Create account</button>
          </div>

          <form id="loginForm" class="auth-form">
            <label>Email<input type="email" id="loginEmail" placeholder="you@example.com" required></label>
            <label>Password<input type="password" id="loginPassword" placeholder="••••••••" required></label>
            <button class="primary-btn" type="submit">Enter Postgram <span>→</span></button>
          </form>

          <form id="registerForm" class="auth-form hidden">
            <label>Email<input type="email" id="registerEmail" placeholder="you@example.com" required></label>
            <label>Password<input type="password" id="registerPassword" placeholder="At least 8 characters" minlength="8" required></label>
            <button class="primary-btn" type="submit">Create account <span>→</span></button>
          </form>
          <p id="authMessage" class="message"></p>
        </div>
      </section>

      <section id="feedView" class="feed-view hidden">
        <div class="feed-heading">
          <div>
            <span class="eyebrow">YOUR FEED</span>
            <h2>Moments</h2>
          </div>
          <button class="primary-btn compact" id="openComposer">＋ New post</button>
        </div>

        <div id="feed" class="feed"></div>
        <div id="emptyState" class="empty hidden">
          <div class="empty-icon">✦</div>
          <h3>Your feed is quiet.</h3>
          <p>Share the first moment and make it yours.</p>
          <button class="primary-btn compact" id="emptyPostBtn">Create a post</button>
        </div>
      </section>
    </main>

    <div id="composer" class="modal hidden">
      <div class="modal-backdrop" data-close="composer"></div>
      <div class="modal-card">
        <button class="close-btn" data-close="composer">×</button>
        <span class="eyebrow">NEW MOMENT</span>
        <h2>What are you sharing?</h2>
        <form id="uploadForm">
          <label class="dropzone" id="dropzone">
            <input type="file" id="postFile" accept="image/*,video/*" required>
            <span class="upload-icon">↑</span>
            <strong id="fileLabel">Choose a photo or video</strong>
            <small>Images and videos supported</small>
          </label>
          <label>Caption<textarea id="caption" maxlength="255" placeholder="Say something about this moment..."></textarea></label>
          <button class="primary-btn" type="submit">Publish moment <span>→</span></button>
          <p id="uploadMessage" class="message"></p>
        </form>
      </div>
    </div>

    <div id="profileMenu" class="profile-menu hidden">
      <div class="profile-email" id="profileEmail">—</div>
      <button id="logoutBtn">Sign out</button>
    </div>

    <div id="toast" class="toast"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
